<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>راهنماخانه - راهنمای شروع یادگیری وب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- هدر -->
    <header class="site-header">
        <div class="container">
            <div class="header-inner">
                <a href="#" class="logo">راهنماخانه</a>
                <nav class="header-nav">
                    <a href="#chapters">فصل‌ها</a>
                    <a href="#request-form">درخواست راهنما</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- بخش هیرو (کاور و متن‌ها) -->
    <main class="container">
        <section class="hero-section">
            
            <!-- ستون سمت راست: کاور رنگی -->
            <div class="cover-box">
                <!-- دکمه وب -->
                <span class="badge-web">وب</span>
                
                <!-- متن کاور -->
                <div class="cover-text">
                    <h2>راهنمای شروع<br>یادگیری وب</h2>
                </div>
                
                <!-- بخش پایین کاور: خط و متن -->
                <div class="cover-footer">
                    <span class="line"></span>
                    <span class="footer-text">نسخهٔ آموزشی · PDF</span>
                </div>
            </div>

            <!-- ستون سمت چپ: متن‌ها و کارت‌ها -->
            <div class="hero-content">
                <h1 class="main-title">راهنمای شروع یادگیری وب</h1>
                <p class="intro-text">سه فصل کوتاه برای کسی که می‌خواهد ساختار صفحه، ظاهر و ثبت تغییرهای خود را مرور کند.</p>
                
                <!-- کارت‌های مشخصات -->
                <div class="specs-grid">
                    <div class="spec-card">
                        <span class="spec-label">زبان</span>
                        <span class="spec-value">نسخهٔ فارسی</span>
                    </div>
                    <div class="spec-card">
                        <span class="spec-label">حجم</span>
                        <span class="spec-value">۲۰ صفحه</span>
                    </div>
                    <div class="spec-card">
                        <span class="spec-label">قالب</span>
                        <span class="spec-value">PDF آموزشی</span>
                    </div>
                </div>

                <!-- کادر قرمز/نارنجی -->
                <div class="warning-box">
                    <p>PDF در این تمرین تولید یا ارسال نمی‌شود.</p>
                </div>
            </div>

        </section>
    </main>

</body>
</html>
